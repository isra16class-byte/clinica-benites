[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; Valores conservadores a propósito: la VM Always Free de Oracle tiene
; 2 OCPU / 12GB compartidos con MySQL y nginx en el mismo host — no hace
; falta (ni conviene) el default de pm.max_children pensado para un
; servidor dedicado grande.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = no
